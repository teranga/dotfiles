# Atuin — local history only; sync stays off until opted into (atuin register/login).
auto_sync = false
update_check = false
style = "compact"
inline_height = 20
enter_accept = false
filter_mode_shell_up_key_binding = "directory"
secrets_filter = true
# Never record commands that start with a space (matches HIST_IGNORE_SPACE).
history_filter = ["^ "]
